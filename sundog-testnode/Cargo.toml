[package]
name = "sundog-testnode"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Container test-node binary: embeds sundog behind a line-based control protocol, for the rightsize container-test harness"
publish = false

[[bin]]
name = "sundog-testnode"
path = "src/main.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
sundog = { version = "0.5.0", path = "../sundog" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[features]
# Off by default so the previous-release checkout `container_util::build_
# previous_testnode` builds from (an older tag, which may predate these
# features) never needs them, and a plain `cargo build -p sundog-testnode`
# stays byte-for-byte today's binary. `container_util::build_testnode` passes
# both explicitly.
spill = ["sundog/spill"]
prometheus = ["sundog/prometheus"]
