[package]
name = "sundog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
bytes = { version = "1.12.1", features = ["serde"] }
chitchat = "0.13.0"
futures = "0.3.34"
hickory-resolver = "0.26.1"
hostname = "0.4.1"
mdns-sd = "0.21.0"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", optional = true }
moka = { version = "0.12.16", features = ["future"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.2"
rustls = { version = "0.23.43", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
smol_str = { version = "0.3.6", features = ["serde"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"] }
tokio-rustls = { version = "0.26.4", optional = true }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
tracing = "0.1.44"
turmoil = { version = "0.7.2", optional = true }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
anyhow = "1.0.104"
proptest = "1.11.0"
rcgen = "0.14.9"
tokio = { version = "1.53.1", features = ["test-util"] }
tracing-subscriber = "0.3.23"

[features]
tls = ["dep:rustls", "dep:tokio-rustls"]
prometheus = ["dep:metrics-exporter-prometheus"]
# Turmoil deterministic-simulation seam (plan §11.2): swaps `net`'s transport
# seam (`src/net/tcp.rs`) from `tokio::net` to `turmoil::net`, so the mesh can
# be driven inside a turmoil `Sim`. Off by default — non-sim builds never pull
# in turmoil at all. See `tests/sim.rs`.
sim = ["dep:turmoil"]
