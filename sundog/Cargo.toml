[package]
name = "sundog"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
homepage = "https://github.com/ngriaznov/sundog"
readme = "../README.md"
keywords = ["cache", "distributed", "replication", "gossip", "embedded"]
categories = ["caching", "asynchronous", "network-programming"]
# The fuzz crate ships in-tree but stands outside the workspace (see the
# root manifest); it has no place in the published package.
exclude = ["fuzz/"]

# docs.rs builds with the additive features on, so the `tls` and
# `prometheus` APIs show up in hosted docs. `sim` stays off: it swaps the
# transport to turmoil's and is a test-only knob.
[package.metadata.docs.rs]
features = ["tls", "prometheus"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"], optional = true }
bytes = { version = "1.12.1", features = ["serde"] }
chitchat = "0.13.0"
futures = "0.3.34"
hashbrown = "0.16.1"
hickory-resolver = "0.26.1"
hostname = "0.4.1"
if-addrs = "0.15.0"
mdns-sd = "0.21.0"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", optional = true }
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.2"
rustls = { version = "0.23.43", optional = true }
serde = { version = "1.0.229", features = ["derive", "rc"] }
smol_str = { version = "0.3.6", features = ["serde"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"] }
tokio-rustls = { version = "0.26.4", optional = true }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
tracing = "0.1.44"
turmoil = { version = "0.7.2", optional = true }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zerocopy = { version = "0.8.56", features = ["derive"] }

[dev-dependencies]
anyhow = "1.0.104"
arbitrary = { version = "1.4.2", features = ["derive"] }
proptest = "1.11.0"
proptest-arbitrary-interop = "0.1.0"
rcgen = "0.14.9"
# Container-based integration tests (`tests/container_util`): rightsize is
# the only permitted way to run containers in this repo — no docker CLI, no
# bollard. Docker backend only: this repo never selects the msb backend
# (RIGHTSIZE_BACKEND=docker throughout), and backend-msb's ureq dependency
# requests rustls's `ring` provider, which collides with the `tls` feature's
# aws-lc-rs under feature unification (rustls panics when both are present).
# 0.7.7 is the first release that also compiles on Windows (0.7.6's
# unconditional Unix-socket imports did not).
rightsize = "0.7.7"
rightsize-modules = { version = "0.7.7", default-features = false, features = ["backend-docker"] }
tokio = { version = "1.53.1", features = ["test-util"] }
tracing-subscriber = "0.3.23"

[features]
tls = ["dep:rustls", "dep:tokio-rustls"]
prometheus = ["dep:metrics-exporter-prometheus"]
# Turmoil deterministic-simulation seam: swaps `net`'s transport seam
# (`src/net/tcp.rs`) from `tokio::net` to `turmoil::net`, so the mesh can
# be driven inside a turmoil `Sim`. Off by default — non-sim builds never pull
# in turmoil at all. See `tests/sim.rs`.
sim = ["dep:turmoil"]
# Exposes `store::model`, the stateful reference model of the apply path
# (`sundog/fuzz`'s hook for its sequence-driven fuzz targets); no effect on
# any other behavior.
fuzzing = ["dep:arbitrary"]
