doc = false
bench = false

[[bin]]
name = "decode_encode_roundtrip"
path = "fuzz_targets/decode_encode_roundtrip.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "gen_seeds"
path = "fuzz_targets/gen_seeds.rs"
test = false
doc = false
bench = false
