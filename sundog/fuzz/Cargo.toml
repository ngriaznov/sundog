[package]
name = "sundog-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
futures = "0.3"
libfuzzer-sys = "0.4"

[dependencies.sundog]
path = ".."
features = ["fuzzing"]

[dependencies.bytes]
version = "1"

[[bin]]
name = "decode_never_panics"
path = "fuzz_targets/decode_never_panics.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_encode_roundtrip"
path = "fuzz_targets/decode_encode_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apply_model"
path = "fuzz_targets/apply_model.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apply_permutation"
path = "fuzz_targets/apply_permutation.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "gen_seeds"
path = "fuzz_targets/gen_seeds.rs"
test = false
doc = false
bench = false
