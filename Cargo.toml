[workspace]
resolver = "3"
members = ["sundog", "sundog-demo", "sundog-testnode"]
# The fuzz crate builds with its own profiles under cargo-fuzz's nightly
# toolchain; it stands alone rather than joining the workspace build graph.
exclude = ["sundog/fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ngriaznov/sundog"
authors = ["sundog contributors"]
description = "Embedded, replicated, zeroconf cache: no server, no coordinator, no config beyond a cluster name"
