[package]
name = "sundog-cookbook"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The sundog book's recipes, compiled and tested"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "runtime-tokio", "sqlite"] }
sundog = { version = "0.6.1", path = "../../sundog" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
