# Weekly sweep of fresh seeds: the turmoil suite under five seeds, and the
# churn read oracle under thirty. Every seed is printed before it runs, so
# a red run is replayed locally with
# `SUNDOG_SIM_SEED=<seed> cargo test -p sundog --features sim --test sim` or
# `SUNDOG_ORACLE_SEED=<seed> cargo test -p sundog --test churn_oracle`.
name: weekly-sim

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  RUSTFLAGS: -D warnings

jobs:
  sim-fresh-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the simulation suite under five fresh seeds
        run: |
          for run in 1 2 3 4 5; do
            SEED=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
            echo "::notice title=sim seed ${run}::replay with SUNDOG_SIM_SEED=$SEED"
            SUNDOG_SIM_SEED=$SEED cargo test --package sundog --features sim --test sim
          done

  churn-oracle-fresh-seeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pick and log the first seed
        run: |
          SEED=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
          echo "SUNDOG_ORACLE_SEED=$SEED" >> "$GITHUB_ENV"
          echo "::notice title=oracle seeds::seeds $SEED onward, 30 runs; a failure names the seed to replay with SUNDOG_ORACLE_SEED"
      - name: Run the churn read oracle
        env:
          SUNDOG_ORACLE_RUNS: "30"
        run: cargo test --release --package sundog --test churn_oracle -- --nocapture
