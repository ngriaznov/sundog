# Cuts the release record for the crate version on the dispatched commit:
# creates the matching `v<version>` git tag and a GitHub release pointing at
# it. Dispatched manually after a successful crates.io publish; fails
# cleanly if the tag already exists.
name: tag-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cargo pkgid -p sundog | sed 's/.*[@#]//')"
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "sundog $VERSION" \
            --notes "sundog $VERSION is on crates.io: https://crates.io/crates/sundog/$VERSION — see [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v$VERSION/CHANGELOG.md) for what's inside."
