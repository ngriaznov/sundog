# Publishes the sundog crate to crates.io. Requires the
# CARGO_REGISTRY_TOKEN repository secret. Two triggers:
#
#   git tag v0.1.0 && git push origin v0.1.0   # tag push
#
# or a manual workflow dispatch against the branch to publish from. On a
# tag push, the tag must match the crate version exactly; the guard step
# refuses a mismatch before anything is uploaded.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(cargo pkgid -p sundog | sed 's/.*[@#]//')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match sundog crate version $VERSION" >&2
            exit 1
          fi

      - name: cargo test
        run: cargo test --workspace

      - name: cargo publish
        run: cargo publish -p sundog
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
