# Publishes the sundog crate to crates.io when a version tag is pushed.
# Requires the CARGO_REGISTRY_TOKEN repository secret. Cut a release with:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the crate version exactly; the guard step refuses a
# mismatch before anything is uploaded.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(cargo pkgid -p sundog | sed 's/.*[@#]//')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match sundog crate version $VERSION" >&2
            exit 1
          fi

      - name: cargo test
        run: cargo test --workspace

      - name: cargo publish
        run: cargo publish -p sundog
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
