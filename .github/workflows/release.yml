# Publishes the sundog crate to crates.io. Requires the
# CARGO_REGISTRY_TOKEN repository secret. Two triggers:
#
#   git tag v0.1.0 && git push origin v0.1.0   # tag push
#
# or a manual workflow dispatch against the branch to publish from. On a
# tag push, the tag must match the crate version exactly; the guard step
# refuses a mismatch before anything is uploaded. Publishing also requires
# a successful run of every verification workflow on the exact commit being
# published: CI, nightly-sim, nightly-fuzz, and nightly-chaos. Dispatch the
# three nightlies on the release commit and wait for them before this run.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require a green run of every verification workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=0
          for wf in ci.yml nightly-sim.yml nightly-fuzz.yml nightly-chaos.yml; do
            count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" \
              --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')
            if [ "${count:-0}" -eq 0 ]; then
              echo "::error title=release gate::no successful $wf run on $GITHUB_SHA"
              missing=1
            else
              echo "$wf: $count successful run(s) on $GITHUB_SHA"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "dispatch the missing workflows on $GITHUB_SHA and rerun once they are green" >&2
            exit 1
          fi

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(cargo pkgid -p sundog | sed 's/.*[@#]//')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match sundog crate version $VERSION" >&2
            exit 1
          fi

      - name: cargo test
        run: cargo test --workspace

      - name: cargo publish
        run: cargo publish -p sundog
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
