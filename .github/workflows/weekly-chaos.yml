# Weekly ten-minute chaos run with a fresh seed, then fifteen rounds of the
# owner-crash scenarios. The chosen seed is printed before the suite runs,
# so a red run is replayed locally with
# `SUNDOG_CONTAINER_TESTS=1 SUNDOG_CHAOS_SEED=<seed> SUNDOG_CHAOS_SECS=600
# RIGHTSIZE_BACKEND=docker cargo test --release -p sundog --test containers
# -- --test-threads=1 chaos_`.
name: weekly-chaos

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  chaos-fresh-seed:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RIGHTSIZE_BACKEND: docker
      SUNDOG_CONTAINER_TESTS: "1"
      SUNDOG_CHAOS_SECS: "600"
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Pick and log this run's seed
        run: |
          SEED=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
          echo "SUNDOG_CHAOS_SEED=$SEED" >> "$GITHUB_ENV"
          echo "::notice title=chaos seed::replay with SUNDOG_CHAOS_SEED=$SEED SUNDOG_CHAOS_SECS=$SUNDOG_CHAOS_SECS"

      - name: Run the chaos scenario
        run: cargo test --release --package sundog --test containers -- --test-threads=1 chaos_

      # The owner-crash tests hit a race only at some timings, so they run
      # fifteen times, the joiner test with a fresh random crash delay each
      # time; a failure prints the delay to replay with
      # SUNDOG_CRASH_DELAY_MS.
      - name: Repeat the owner-crash scenarios
        run: |
          for run in $(seq 15); do
            echo "::group::owner-crash round $run"
            cargo test --release --package sundog --test containers -- --test-threads=1 \
              distributed_kill_one_owner_and_every_key_still_fetchable_then_re_owned \
              distributed_owner_crash_during_a_joiners_pull_keeps_every_key_fetchable
            echo "::endgroup::"
          done

      - name: Upload container node logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-node-logs
          path: target/container-logs/
          if-no-files-found: warn
