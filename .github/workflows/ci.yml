name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::pedantic

      - name: cargo clippy (sim feature)
        run: cargo clippy --package sundog --all-targets --features sim -- -D warnings -W clippy::pedantic

      # `tls,prometheus` together: both are independent, real-tokio-only
      # features (the `tls` module and its mesh-wrapping only compile under
      # `not(feature = "sim")`, see `net::tls`'s module docs), so nothing
      # about combining them is different from either alone.
      - name: cargo clippy (tls,prometheus features)
        run: cargo clippy --package sundog --all-targets --features tls,prometheus -- -D warnings -W clippy::pedantic

      - name: cargo test
        run: cargo test --workspace

      - name: cargo test (turmoil simulation suite)
        run: cargo test --package sundog --features sim --test 'sim*'

      # Exercises tests/tls.rs and tests/prometheus_exporter.rs (silent no-ops
      # otherwise, each `#![cfg(feature = "...")]`-gated) alongside the full
      # default suite. Not `--all-features`: `sim` swaps the entire transport
      # to turmoil (`net::tcp`'s seam), which every plain `#[tokio::test]`
      # elsewhere in the crate — including these two features' own tests —
      # dials real OS sockets against, so `sim` combined with anything else
      # fails outside a turmoil `Sim`; `--all-features` compiles cleanly but
      # is nonsensical to *test* against, which is why `sim` keeps its own
      # lane above instead.
      - name: cargo test (tls,prometheus features)
        run: cargo test --package sundog --features tls,prometheus

  # Portability lane: the crate claims no OS-specific behavior, but mDNS,
  # socket handling, and timers all differ per platform — this proves the
  # workspace builds and its default-feature test suite (plus the turmoil
  # sim lane) passes on macOS and Windows, not only Linux. The container/
  # musl and tls,prometheus lanes stay Linux-only: containers need a Linux
  # docker host, and the `tls` feature's aws-lc-rs build wants NASM on
  # Windows — a separate decision from plain portability.
  os-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

      - name: cargo test (turmoil simulation suite)
        run: cargo test --package sundog --features sim --test 'sim*'

  # Container-backed multi-node suite, exclusively through the `rightsize`
  # crate — no docker CLI, no bollard. Separate job because it needs the
  # musl target/toolchain and a container backend that the other lanes
  # don't. RIGHTSIZE_BACKEND=docker: sundog's gossip is UDP, and rightsize's
  # microsandbox network emulation relays TCP only, so the docker backend is
  # the one that actually carries chitchat's traffic. Hosted GitHub runners
  # have both KVM and docker, so the default SUNDOG_TEST_BASE_IMAGE
  # (alpine:3.22) pulls fine here.
  containers:
    runs-on: ubuntu-latest
    env:
      RIGHTSIZE_BACKEND: docker
      SUNDOG_CONTAINER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --test containers
        run: cargo test --release --package sundog --test containers -- --test-threads=1
