# Yanks one published sundog version from crates.io. Manual only; requires
# the CARGO_REGISTRY_TOKEN repository secret. Yanking hides a version from
# new resolutions without deleting it — existing lockfiles keep working.
name: yank

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to yank (e.g. 0.1.2)"
        required: true
        type: string

jobs:
  yank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo yank
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like 1.2.3, got: $VERSION" >&2
            exit 1
          fi
          cargo yank sundog --version "$VERSION"
