# Weekly bounded model checking with Kani over the crate's pure arithmetic
# and decision rules: the `#[kani::proof]` harnesses under each module's
# `kani_proofs` (expiry packing, the touch stamp, hash-to-bucket indexing,
# the compaction shrink rule, the reconciliation retry bounds, the gossip
# bind retry, the anti-entropy skip rule, the hybrid logical
# clock, frame length arithmetic, spill sizing). Reproduce locally with
# `cargo install --locked kani-verifier && cargo kani setup && cargo kani -p sundog --features spill`.
#
# Two notices in the log are Kani's own, not the crate's: rustc prints
# "use of an unstable feature" once per compiled crate because kani-driver
# injects `feature(register_tool)` with `--force-warn unstable_features`,
# which no lint level overrides, and the compiler lists `caller_location`
# and `foreign function` as unsupported constructs because core's
# `panic_nounwind` path is codegen'd for every harness; a verified harness
# proves that path unreachable. `-D warnings` still fails the run on any
# warning the crate itself raises.
name: weekly-kani

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

env:
  RUSTFLAGS: -D warnings

jobs:
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: model-checking/kani-github-action@v1.1
        with:
          args: -p sundog --features spill
