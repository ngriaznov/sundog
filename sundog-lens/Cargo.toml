[package]
name = "sundog-lens"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Terminal UI that watches a live sundog cluster from outside: a gossip-only observer plus each node's Prometheus exporter"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
futures = "0.3.34"
rand = "0.10.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smol_str = "0.3.6"
# Default features only. Never enable sundog/prometheus here, not even as a
# dev-dependency: feature unification would change sundog's build in the
# plain `cargo test --workspace` lane.
sundog = { version = "0.6.3", path = "../sundog" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
# The director's tests run on a paused clock.
tokio = { version = "1.53.1", features = ["test-util"] }
